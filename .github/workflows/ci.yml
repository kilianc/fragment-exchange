name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the GSX compiler
        run: go install github.com/kilianc/gsx/cmd/gsx@latest

      - name: Generated files are current
        run: gsx -check ./web

      - name: Sources are formatted
        run: |
          gsx fmt -l ./web
          test -z "$(gofmt -l . | grep -v '\.gsx\.go$')" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # ubuntu-latest ships Chrome. FX_REQUIRE_CHROME below turns a missing
      # browser into a failure rather than a suite that quietly tests nothing.
      - name: Chrome is available
        run: google-chrome --version

      - name: Test
        env:
          FX_CHROME: google-chrome
          FX_REQUIRE_CHROME: "1"
        run: go test -race ./...

      - name: The deploy target builds
        run: go build -o /dev/null ./cmd/server

      # On a tag, the tag name is passed in so it must match the version in
      # fx.js. jsDelivr serves tags immutably, so a wrong hash or version
      # published here cannot be corrected in place — it costs a version.
      - name: Release consistency
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bin/check-release "${GITHUB_REF_NAME}"
          else
            bin/check-release
          fi

      # Only on a tag: the URLs we publish are pinned to one, so there is
      # nothing to fetch before it exists. This is the check that would have
      # caught v1.0.0 advertising a URL jsDelivr could not serve.
      - name: The published CDN URLs resolve
        if: github.ref_type == 'tag'
        run: bin/check-release --cdn "${GITHUB_REF_NAME}"
